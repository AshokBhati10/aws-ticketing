AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AWS serverless ticketing system POC: Vue frontend, Cognito Hosted UI auth,
  API Gateway HTTP API (JWT authorizer), Lambda (Node.js 20), DynamoDB,
  S3 attachments. Pure CloudFormation - deploy with scripts/deploy.sh.

Parameters:
  ProjectName:
    Type: String
    Default: aws-ticketing-poc
    Description: Prefix used for resource names.
  FrontendUrl:
    Type: String
    Default: http://localhost:5173
    Description: >-
      Origin of the Vue frontend (no trailing slash). Used for Cognito
      callback/logout URLs, S3 CORS and API CORS.
  CognitoDomainPrefix:
    Type: String
    Description: >-
      Globally unique prefix for the Cognito Hosted UI domain
      (https://<prefix>.auth.<region>.amazoncognito.com).
  LambdaCodeBucket:
    Type: String
    Description: S3 bucket holding the packaged Lambda zip (uploaded by scripts/deploy.sh).
  LambdaCodeKey:
    Type: String
    Description: S3 key of the packaged Lambda zip.
  DeployedFrontendUrl:
    Type: String
    Default: ""
    Description: >-
      Public HTTPS URL of the deployed frontend
      (e.g. https://d123abc.cloudfront.net). When set, the S3 static-website
      frontend bucket and a CloudFront distribution (HTTPS via the default
      *.cloudfront.net certificate) are created; this URL is appended to the
      API/S3 CORS origins and, because it is HTTPS, to the Cognito
      callback/logout URLs as well. Leave empty for backend-only deployments.

Conditions:
  HasDeployedFrontendUrl: !Not [!Equals [!Ref DeployedFrontendUrl, ""]]
  # Cognito rejects non-HTTPS callback URLs (localhost excepted), so the
  # deployed URL is only ever sent to Cognito when it uses https.
  FrontendUrlIsHttps: !Equals [!Select ["0", !Split ["://", !Ref DeployedFrontendUrl]], "https"]

Resources:
  # ---------------- Cognito ----------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${ProjectName}-users"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      MfaConfiguration: "OFF"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${ProjectName}-web"
      GenerateSecret: false
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - !Sub "${FrontendUrl}/callback"
        - !If [FrontendUrlIsHttps, !Sub "${DeployedFrontendUrl}/callback", !Ref "AWS::NoValue"]
      LogoutURLs:
        - !Ref FrontendUrl
        - !If [FrontendUrlIsHttps, !Ref DeployedFrontendUrl, !Ref "AWS::NoValue"]
      SupportedIdentityProviders:
        - COGNITO
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      PreventUserExistenceErrors: ENABLED

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool

  AgentsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Agents
      Description: Support agents - can view and manage all tickets.
      UserPoolId: !Ref UserPool

  CustomersGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Customers
      Description: Customers - can view and manage their own tickets.
      UserPoolId: !Ref UserPool

  # ---------------- DynamoDB ----------------
  TicketsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-tickets"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ticketId
          AttributeType: S
        - AttributeName: customerId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: ticketId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: CustomerIndex
          KeySchema:
            - AttributeName: customerId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  CommentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-comments"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ticketId
          AttributeType: S
        - AttributeName: commentId
          AttributeType: S
      KeySchema:
        - AttributeName: ticketId
          KeyType: HASH
        - AttributeName: commentId
          KeyType: RANGE
      # commentId is "${ISO timestamp}_${rand}", so sort-key order = chronological

  # ---------------- S3 ----------------
  AttachmentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-attachments-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref FrontendUrl
              - !If [HasDeployedFrontendUrl, !Ref DeployedFrontendUrl, !Ref "AWS::NoValue"]
            AllowedMethods:
              - GET
              - PUT
            AllowedHeaders:
              - "*"
            MaxAge: 3000

  # ---------------- Frontend hosting (S3 static website + CloudFront HTTPS) ----------------
  # Additive only: created only when DeployedFrontendUrl is set. The existing
  # attachments bucket above is untouched; the frontend uses a SEPARATE bucket.
  # CloudFront sits in front of the UNCHANGED S3 website bucket (custom origin
  # on the bucket website endpoint, HTTP CloudFront->origin, redirect-to-HTTPS
  # for viewers, default *.cloudfront.net certificate). Because the deployed
  # URL is HTTPS, it IS added to the Cognito callback/logout URLs via the
  # FrontendUrlIsHttps condition.
  FrontendBucket:
    Type: AWS::S3::Bucket
    Condition: HasDeployedFrontendUrl
    Properties:
      BucketName: !Sub "${ProjectName}-frontend-${AWS::AccountId}"
      # ErrorDocument: index.html gives Vue SPA routing fallback
      # (/tickets/<id> etc. serve index.html; S3 returns HTTP 404 status).
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        # Public bucket POLICY must be allowed for static website hosting.
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: HasDeployedFrontendUrl
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"

  # ---------------- Frontend CDN (CloudFront HTTPS in front of the S3 website bucket) ----------------
  # The bucket above is NOT modified: CloudFront uses the bucket's website
  # endpoint as a custom origin (HTTP between CloudFront and S3; HTTPS for
  # viewers). No custom domain / ACM certificate - the default
  # *.cloudfront.net certificate is used.
  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: HasDeployedFrontendUrl
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ProjectName} frontend"
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: frontend-s3-website-origin
            DomainName: !Select ["2", !Split ["/", !GetAtt FrontendBucket.WebsiteURL]]
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: frontend-s3-website-origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          # AWS-managed CachingDisabled policy: every request reaches the
          # origin, so a fresh index.html is always served after each deploy.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        # SPA fallback: Vue client-side routes (/login, /callback,
        # /tickets/<id>, ...) serve index.html with HTTP 200.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  # ---------------- Lambda ----------------
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: !Sub "${ProjectName}-lambda-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt TicketsTable.Arn
                  - !Sub "${TicketsTable.Arn}/index/*"
                  - !GetAtt CommentsTable.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "${AttachmentsBucket.Arn}/*"

  TicketFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-api"
      Runtime: nodejs20.x
      # The deployment zip must contain src/ at its root (see scripts/deploy.sh).
      Handler: src/handler.handler
      Role: !GetAtt LambdaRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          TICKETS_TABLE: !Ref TicketsTable
          COMMENTS_TABLE: !Ref CommentsTable
          ATTACHMENTS_BUCKET: !Ref AttachmentsBucket

  # ---------------- API Gateway HTTP API ----------------
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${ProjectName}-api"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendUrl
          - !If [HasDeployedFrontendUrl, !Ref DeployedFrontendUrl, !Ref "AWS::NoValue"]
        AllowMethods:
          - "*"
        AllowHeaders:
          - authorization
          - content-type
        MaxAge: 86400

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: cognito-authorizer
      AuthorizerType: JWT
      IdentitySource:
        - $request.header.Authorization
      JwtConfiguration:
        Audience:
          - !Ref UserPoolClient
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"

  LambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TicketFunction.Arn}/invocations"
      PayloadFormatVersion: "2.0"

  RoutePostTickets:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /tickets"
      Target: !Sub "integrations/${LambdaIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RouteGetTickets:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /tickets"
      Target: !Sub "integrations/${LambdaIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RouteGetTicket:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /tickets/{ticketId}"
      Target: !Sub "integrations/${LambdaIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RoutePutTicket:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "PUT /tickets/{ticketId}"
      Target: !Sub "integrations/${LambdaIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RoutePostComment:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /tickets/{ticketId}/comments"
      Target: !Sub "integrations/${LambdaIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RouteGetComments:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /tickets/{ticketId}/comments"
      Target: !Sub "integrations/${LambdaIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RoutePresignedUrl:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /tickets/presigned-url"
      Target: !Sub "integrations/${LambdaIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true

  LambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt TicketFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*"

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito app client ID (frontend VITE_COGNITO_CLIENT_ID)
    Value: !Ref UserPoolClient
  CognitoDomain:
    Description: Cognito Hosted UI base domain (frontend VITE_COGNITO_DOMAIN)
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  AttachmentsBucketName:
    Value: !Ref AttachmentsBucket
  TicketsTableName:
    Value: !Ref TicketsTable
  CommentsTableName:
    Value: !Ref CommentsTable
  FrontendBucketName:
    Condition: HasDeployedFrontendUrl
    Description: S3 bucket hosting the built frontend
    Value: !Ref FrontendBucket
  FrontendWebsiteUrl:
    Condition: HasDeployedFrontendUrl
    Description: S3 static website endpoint of the frontend bucket (CloudFront origin; not used directly by viewers).
    Value: !GetAtt FrontendBucket.WebsiteURL
  FrontendDistributionId:
    Condition: HasDeployedFrontendUrl
    Description: CloudFront distribution ID for the frontend (used for cache invalidations).
    Value: !Ref FrontendDistribution
  FrontendCloudFrontUrl:
    Condition: HasDeployedFrontendUrl
    Description: Public HTTPS URL of the deployed frontend (use for VITE_COGNITO_REDIRECT_URI etc.).
    Value: !Sub "https://${FrontendDistribution.DomainName}"
